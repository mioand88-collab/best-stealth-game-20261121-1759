<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Night Vault — a top-down stealth game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0d12;
    color: #e8e6df;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.35em;
    color: #f2c94c;
  }
  p {
    margin: 0;
    font-size: 13px;
    color: #9a978c;
  }
  canvas {
    display: block;
    background: #101218;
    box-shadow: 0 0 0 1px #2a2e38, 0 18px 48px rgba(0, 0, 0, 0.6);
    max-width: 96vw;
    max-height: 88vh;
  }
</style>
</head>
<body>
<h1>NIGHT VAULT</h1>
<p>WASD / arrows to move &middot; SHIFT to sneak &middot; click to toss a pebble &middot; R to restart</p>
<canvas id="game"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
